<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ 검색</title>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }
    input[type="text"] {
      width: 80%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      font-size: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      margin-left: 0.5rem;
      cursor: pointer;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.75rem;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
    a {
      color: #0056b3;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>📄 FAQ 키워드 검색</h1>
  <input type="text" id="searchInput" placeholder="키워드를 입력하세요 (예: 스타킹, 구강세정기 등)">
  <button onclick="loadFromSheet()">검색</button>

  <table>
    <thead>
      <tr>
        <th>제목</th>
        <th>내용</th>
        <th>PDF 링크</th>
      </tr>
    </thead>
    <tbody id="faqTable">
      <!-- 데이터 행은 아래 JS에서 자동 삽입 -->
    </tbody>
  </table>

  <footer style="margin-top: 2rem; font-size: 0.9rem; color: gray;">
    <span id="busuanzi_container_site_pv">
      📈 총 방문자 수: <span id="busuanzi_value_site_pv"></span> 회
    </span>
  </footer>

  <!-- 방문자 수 카운터 (Counter.dev) -->
  <script defer src="https://cdn.counter.dev/script.js"
          data-id="87c02a6c-c06f-4c94-9d27-9d46d4ae65bd"
          data-utcoffset="9"></script>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

  <script>
    let faqData = [];

    function renderTable(data) {
      const table = document.getElementById("faqTable");
      table.innerHTML = "";
      data.forEach(item => {
        const row = `<tr>
          <td>${item.title}</td>
          <td>${item.content}</td>
          <td><a href="https://osteonic.github.io/files/2024_faq.pdf#page=${item.page}" target="_blank">PDF 보기</a></td>
        </tr>`;
        table.innerHTML += row;
      });
    }

    function filterResults() {
      const keyword = document.getElementById("searchInput").value.toLowerCase();
      const filtered = faqData.filter(item =>
        item.title.toLowerCase().includes(keyword) ||
        item.content.toLowerCase().includes(keyword)
      );
      renderTable(filtered);
    }

    function loadFromSheet() {
      const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQCIi1Qyx3hBylUPDLU4yPh5WChDdjFGxeu7O5QYlOAsFX3jaE7pSTkSzSM8N1VKv3SFDqZfj01VGcs/pub?output=csv';

      Papa.parse(sheetUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          faqData = results.data.filter(row => row['제목'] && row['내용'] && row['페이지']).map(row => ({
            title: row['제목'],
            content: row['내용'],
            page: row['페이지']
          }));
          filterResults();
        },
        error: function(err, file, inputElem, reason) {
          console.error("PapaParse error:", err, reason);
          alert('시트를 불러오는 중 오류가 발생했습니다: ' + (err.message || reason || err));
        }
      });
    }
  </script>
</body>
</html>
